name: CI

on:
  pull_request:
    branches: [main, feature/winui]
  push:
    branches: [feature/winui]

permissions:
  contents: read

jobs:
  build-test-coverage:
    name: build-test-coverage
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Blackjack.slnx --configuration Release

      - name: Test with coverage
        run: >
          dotnet test Blackjack.slnx --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ${{ github.workspace }}/coverage

      - name: Enforce coverage threshold
        shell: pwsh
        run: ./.github/scripts/check-coverage.ps1 -Threshold 95 -Packages Blackjack.Game,Blackjack.Presentation -Path "${{ github.workspace }}/coverage"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/**/coverage.cobertura.xml
